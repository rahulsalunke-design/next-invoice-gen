<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="invoice">

    <!-- Invoice header -->
    <header class="invoice-header">
      <h1>Invoice</h1>
      <div class="invoice-meta">
        <p><span>Invoice No:</span> #0001</p>
        <p><span>Date:</span> 24 Nov 2026</p>
      </div>
    </header>

    <!-- Bill to block -->
    <section class="bill-to">
      <h2>Bill to</h2>
      <p>Client Name</p>
      <p>Client Address</p>
      <p>client@email.com</p>
    </section>

    <!-- Items table (empty body for now) -->
    <table class="items">
      <thead>
        <tr>
          <th>Description</th>
          <th>Qty</th>
          <th>Price</th>
          <th>Total</th>
          <th aria-label="Delete"></th>
        </tr>
      </thead>
      <tbody id="items-body">
        <!-- Rows are added by script.js -->
      </tbody>
    </table>

    <button type="button" id="add-item-btn" class="add-item-btn">Add item</button>

    <!-- Totals block -->
    <section class="totals">
      <div class="totals-row">
        <span class="totals-label">Subtotal</span>
        <span class="totals-percent"></span>
        <span class="totals-value" id="subtotal">0.00</span>
      </div>
      <div class="totals-row">
        <label class="totals-label" for="discount-percent">Discount %</label>
        <span class="totals-percent">
          <input type="number" id="discount-percent" value="0">
        </span>
        <span class="totals-value" id="discount-amount">0.00</span>
      </div>
      <div class="totals-row">
        <label class="totals-label" for="tax-percent">Tax %</label>
        <span class="totals-percent">
          <input type="number" id="tax-percent" value="0">
        </span>
        <span class="totals-value" id="tax-amount">0.00</span>
      </div>
      <div class="totals-row grand-total">
        <span class="totals-label">Grand Total</span>
        <span class="totals-percent"></span>
        <span class="totals-value" id="grand-total">0.00</span>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
